version: "3.9"
services:
  mcp-server:
    build: .
    container_name: recife-mcp-server
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.1-codex-max}
      DUCKDB_DATA_DIR: /data
      HTTP_PORT: 8000
      MAX_RESULT_ROWS: ${MAX_RESULT_ROWS:-200}
    ports:
      - "8000:8000"
    volumes:
      - duckdb_data:/data
    command: uvicorn server.http_server:app --host 0.0.0.0 --port 8000

volumes:
  duckdb_data:
