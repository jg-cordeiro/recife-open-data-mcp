[project]
name = "recife-open-data-mcp"
version = "0.1.0"
description = "MCP server and tools for Recife open data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "braintrust>=0.0.1",
    "duckdb>=0.9.0",
    "fastapi>=0.115.0",
    "fastmcp>=2.13.3",
    "httpx>=0.27.0",
    "openai>=2.9.0",
    "python-dotenv>=1.2.1",
    "sqlparse>=0.5.4",
    "sse-starlette>=2.1.3",
    "typer>=0.20.0",
    "uvicorn[standard]>=0.32.0",
]
